{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": ${KEA_INTERFACES},
      "service-sockets-max-retries": 10,
      "service-sockets-require-all": true
    },

    "control-sockets": [{
      "socket-type": "https",
      "socket-address": "0.0.0.0",
      "socket-port": 8004,
      "cert-file": "/kea/run/server.crt",
      "key-file": "/kea/run/server.key",
      "cert-required": false,
      "trust-anchor": "/kea/run/server.crt"
    }],

    "lease-database": {
      "type": "memfile",
      "lfc-interval": 3600,
      "persist": true,
      "name": "/kea/var/dhcp4.leases"
    },

    "expired-leases-processing": {
      "reclaim-timer-wait-time": 10,
      "flush-reclaimed-timer-wait-time": 25,
      "hold-reclaimed-time": 3600,
      "max-reclaim-leases": 100,
      "max-reclaim-time": 250,
      "unwarned-reclaim-cycles": 5
    },

    "multi-threading": {
      "enable-multi-threading": true,
      "packet-queue-size": 16,
      "thread-pool-size": 12
    },

    "renew-timer": 900,
    "rebind-timer": 1800,
    "valid-lifetime": 3600,

    "subnet4": [
      <?include "/kea/etc/subnets.conf"?>
    ],

    "loggers": [{
      "name": "kea-dhcp4",
      "output_options": [{
        "output": "stdout",
        "pattern": "{\"time\":\"%D{%Y-%m-%dT%H:%M:%S.%q}\",\"type\":\"%p\",\"logger\":\"%c\",\"msg\":\"%m\"}\n"
      }],
      "severity": "warn"
    }]
  }
}